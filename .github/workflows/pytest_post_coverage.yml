name: pytest post coverage

on:
  workflow_run:
    workflows: ['pytest check and post coverage']
    types:
      - completed

jobs:
  authorize-coverage-publication:
    name: authorize coverage publication
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - name: Verify source workflow result
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [[ "${CONCLUSION}" == "success" ]]; then
            echo "authorized=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${CONCLUSION}" != "failure" ]]; then
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # workflow_run.conclusion includes every job, including the aiohttp
          # floor job. Permit coverage only when the locked test job
          # succeeded in this exact attempt. This read-only check uses trusted
          # workflow_run metadata and does not check out source code.
          test -n "${RUN_ATTEMPT}"
          authorized="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            | jq '[.[] | .jobs[]? | select(.name == "pytest check and post coverage")]
              | length == 1 and .[0].status == "completed" and .[0].conclusion == "success"')"
          echo "authorized=${authorized}" >> "${GITHUB_OUTPUT}"

  test:
    name: pytest post coverage
    runs-on: ubuntu-latest
    needs: authorize-coverage-publication
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      needs.authorize-coverage-publication.outputs.authorized == 'true'
    permissions:
      # Gives the action the necessary permissions for publishing new
      # comments in pull requests.
      pull-requests: write
      # Allows the action to inspect repository metadata while posting the
      # artifact-generated comment. This job does not update coverage data.
      contents: read
      # Gives the action the necessary permissions for looking up the
      # workflow that launched this workflow, and download the related
      # artifact that contains the comment to be published
      actions: read
    steps:
      # DO NOT run actions/checkout here, for security reasons
      # For details, refer to https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post coverage Comment to PR
        uses: py-cov-action/python-coverage-comment-action@v4.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}

  publish-default-coverage:
    name: pytest publish default coverage
    if: >-
      github.event.workflow_run.event == 'push' &&
      needs.authorize-coverage-publication.outputs.authorized == 'true' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: authorize-coverage-publication
    runs-on: ubuntu-latest
    concurrency:
      group: pytest-default-coverage-${{ github.event.repository.default_branch }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tested default-branch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify trusted default branch matches test run
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Download coverage data from test run
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: python-coverage-data
          path: .
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish coverage report
        uses: py-cov-action/python-coverage-comment-action@v4.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
