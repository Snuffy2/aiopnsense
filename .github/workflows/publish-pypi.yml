name: Publish Python Distribution

run-name: Publish ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the released revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TARGET" != "$DEFAULT_BRANCH" ]]; then
            echo "Release target must be the default branch." >&2
            exit 1
          fi
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tag must be a v-prefixed semantic version." >&2
              exit 1
            fi
          elif [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*|(a|b|rc)[0-9]+)$ ]]; then
            echo "Prerelease tag must contain a supported prerelease suffix." >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_sha="$(git rev-parse "$RELEASE_TAG^{}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_sha" ]]; then
            echo "Checked-out revision does not match the release tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_sha" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "Release tag must identify a default-branch commit." >&2
            exit 1
          fi
          grep -Fx "VERSION = \"$RELEASE_TAG\"  # x-release-please-version" \
            aiopnsense/const.py >/dev/null

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: Build and check distributions
        run: |
          set -euo pipefail
          uv build
          uvx --from twine twine check dist/*

      - name: Store distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ github.event.release.prerelease && 'testpypi' || 'pypi' }}
      url: ${{ github.event.release.prerelease && 'https://test.pypi.org/project/aiopnsense/' || 'https://pypi.org/project/aiopnsense/' }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish prerelease to TestPyPI
        if: github.event.release.prerelease
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish stable release to PyPI
        if: github.event.release.prerelease == false
        uses: pypa/gh-action-pypi-publish@release/v1
