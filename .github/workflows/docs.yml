name: docs

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Immutable commit SHA required by release orchestration
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.number || 'push' }}-${{ github.event.pull_request.head.ref || inputs.expected_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require expected release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked out release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - name: Setup uv (with caching)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock

      - name: Build HTML docs
        run: uv run --locked --extra docs sphinx-build -b html docs/source docs/_build/html

      - name: Build doctests
        run: uv run --locked --extra docs sphinx-build -b doctest docs/source docs/_build/doctest
