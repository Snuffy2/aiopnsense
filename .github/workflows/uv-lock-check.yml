name: Validate uv lock

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Immutable commit SHA required by release orchestration
        required: true
        type: string

permissions:
  contents: read

jobs:
  uv-lock-check:
    name: Validate uv lock consistency
    runs-on: ubuntu-latest
    steps:
      - name: Require expected release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked out release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: Check uv lock consistency
        run: uv lock --check
