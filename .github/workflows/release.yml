name: Release

run-name: Release ${{ inputs.tag || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version bump when tag is blank
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      tag:
        description: Release tag (for example, v1.1.8 or v1.2.0-beta.1)
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish to TestPyPI as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      release-tag: ${{ steps.release_tag.outputs.release-tag }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH," >&2
            echo "not $RELEASE_REF." >&2
            exit 1
          fi

      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          EXPLICIT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ -n "$EXPLICIT_TAG" ]]; then
            if [[ "$BUMP_TYPE" != "none" ]]; then
              echo "An explicit tag requires bump=none." >&2
              exit 1
            fi
            python3 .github/scripts/prepare_release.py --check-only \
              --expected-prerelease "$IS_PRERELEASE" "$EXPLICIT_TAG"
            echo "release-tag=$EXPLICIT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Prereleases require an explicit tag." >&2
            exit 1
          fi
          if [[ "$BUMP_TYPE" == "none" ]]; then
            echo "Provide an explicit tag or select a stable version bump." >&2
            exit 1
          fi

          release_tags="$(gh release list --exclude-drafts \
            --exclude-pre-releases --limit 1000 --json tagName \
            --jq '.[].tagName')"
          release_tag="$(printf '%s\n' "$release_tags" | \
            python3 .github/scripts/prepare_release.py --next-tag "$BUMP_TYPE")"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release request
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          python3 .github/scripts/prepare_release.py --check-only \
            --expected-prerelease "$IS_PRERELEASE" "$RELEASE_TAG"

      - name: Require unused tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          set +e
          tag_output="$(git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" 2>&1)"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Remote tag already exists: $RELEASE_TAG" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to verify whether remote tag exists:" >&2
              echo "$RELEASE_TAG" >&2
              printf '%s\n' "$tag_output" >&2
              exit 1
              ;;
          esac

          set +e
          release_output="$(gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "GitHub release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! printf '%s\n' "$release_output" | \
            grep -Eq '^HTTP/[0-9.]+ 404 '; then
            echo "Unable to verify whether GitHub release exists:" >&2
            echo "$RELEASE_TAG" >&2
            printf '%s\n' "$release_output" >&2
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Install github-changelog-generator
        run: gem install github_changelog_generator --no-document

      - name: Generate documentation changelog
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: github_changelog_generator --future-release "$RELEASE_TAG"

      - name: Create release commit and annotated tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          python3 .github/scripts/prepare_release.py "$RELEASE_TAG"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add aiopnsense/const.py docs/source/changelog.md
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: Build and check distributions
        run: |
          set -euo pipefail

          uv build
          uvx --from twine twine check dist/*

      - name: Store distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

  github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
        run: |
          set -euo pipefail

          arguments=(release create "$RELEASE_TAG" dist/*)
          arguments+=(--generate-notes --title "$RELEASE_TAG" --verify-tag)
          arguments+=(--repo "$GITHUB_REPOSITORY")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ inputs.prerelease && 'testpypi' || 'pypi' }}
      url: ${{ inputs.prerelease && 'https://test.pypi.org/project/aiopnsense/' || 'https://pypi.org/project/aiopnsense/' }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish prerelease to TestPyPI
        if: inputs.prerelease
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish stable release to PyPI
        if: ${{ !inputs.prerelease }}
        uses: pypa/gh-action-pypi-publish@release/v1
