name: Release
run-name: Release ${{ github.event.release.tag_name }}
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prerelease: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock
      - name: Snapshot trusted policy and locked tools
        id: trusted
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" == "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" ]]
          helpers="$RUNNER_TEMP/trusted-release-helpers"
          mkdir -p "$helpers"
          cp .github/scripts/{prepare_release.py,release_version.py,release_handoff.py,release_changelog.py} "$helpers/"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/release-tools" uv sync --locked --only-group dev --no-install-project
          echo "sha=$trusted_sha" >> "$GITHUB_OUTPUT"
          echo "helpers=$helpers" >> "$GITHUB_OUTPUT"
      - name: Determine candidate source and changelog range
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          HELPERS: ${{ steps.trusted.outputs.helpers }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 "$HELPERS/prepare_release.py" --check-only --expected-prerelease "$PRERELEASE" "$RELEASE_TAG"
          git fetch --force --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch --force --tags origin
          target_sha="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          [[ "$tag_sha" == "$EVENT_SHA" ]]
          source_sha="$EVENT_SHA"
          generate_changelog=false
          git checkout --detach "$EVENT_SHA"
          if [[ "$PRERELEASE" == true ]]; then
            git merge-base --is-ancestor "$EVENT_SHA" "$target_sha"
            grep -Fx "VERSION = \"$RELEASE_TAG\"" aiopnsense/const.py >/dev/null
          elif [[ "$(git show -s --format=%s "$EVENT_SHA")" == "Release $RELEASE_TAG" ]]; then
            source_sha="$(git rev-parse "$EVENT_SHA^")"
            [[ "$(git rev-list --parents -n 1 "$EVENT_SHA" | wc -w | tr -d ' ')" == 2 ]]
            [[ "$(git diff --name-only "$source_sha" "$EVENT_SHA")" == $'aiopnsense/const.py\ndocs/source/changelog.md' ]]
            git merge-base --is-ancestor "$EVENT_SHA" "$target_sha"
            grep -Fx "VERSION = \"$RELEASE_TAG\"" aiopnsense/const.py >/dev/null
            [[ "$(grep -Fc "## [$RELEASE_TAG](" docs/source/changelog.md)" == 1 ]]
          else
            [[ "$target_sha" == "$EVENT_SHA" ]]
            previous_tag="$(git tag --merged "$source_sha" | python3 "$HELPERS/release_changelog.py" --previous-stable-tag "$RELEASE_TAG")"
            if [[ -z "$previous_tag" ]]; then
              previous_tag="$(git rev-list --max-parents=0 "$source_sha")"
              [[ "$previous_tag" =~ ^[0-9a-f]{40}$ ]]
            fi
            printf 'previous-tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"
            generate_changelog=true
          fi
          {
            echo "source-sha=$source_sha"
            echo "target-sha=$target_sha"
            echo "tag-oid=$tag_oid"
            echo "generate-changelog=$generate_changelog"
          } >> "$GITHUB_OUTPUT"
      - name: Build fresh stable changelog
        id: changelog
        if: steps.source.outputs.generate-changelog == 'true'
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.source.outputs.previous-tag }}
          toTag: ${{ steps.source.outputs.source-sha }}
          outputFile: .release-changelog.md
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}} [\\##{{NUMBER}}](#{{URL}}) ([#{{AUTHOR}}](https://github.com/#{{AUTHOR}}))",
              "empty_template": "",
              "categories": [
                {"title": "**Breaking Changes**", "labels": ["Semver-Major", "breaking-change"], "consume": true},
                {"title": "**New Features**", "labels": ["feature"], "consume": true},
                {"title": "**Enhancements**", "labels": ["Semver-Minor", "enhancement"], "consume": true},
                {"title": "**Bug Fixes**", "labels": ["fix", "bug", "bugfix"], "consume": true},
                {"title": "**Documentation**", "labels": ["documentation"], "consume": true},
                {"title": "**Code Quality**", "labels": ["code-quality"], "consume": true},
                {"title": "**Maintenance**", "labels": ["chore", "github_actions"], "consume": true},
                {"title": "**Other Changes**", "labels": [], "consume": true}
              ],
              "ignore_labels": ["ignore-for-release", "dependencies"]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Construct and build candidate without write credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          HELPERS: ${{ steps.trusted.outputs.helpers }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          TARGET_SHA: ${{ steps.source.outputs.target-sha }}
          TAG_OID: ${{ steps.source.outputs.tag-oid }}
          GENERATE_CHANGELOG: ${{ steps.source.outputs.generate-changelog }}
          PREVIOUS_TAG: ${{ steps.source.outputs.previous-tag }}
        run: |
          set -euo pipefail
          candidate_sha="$SOURCE_SHA"
          if [[ "$GENERATE_CHANGELOG" == true ]]; then
            fragment=.release-changelog.md
            release_date="$(git show -s --format=%cs "$SOURCE_SHA")"
            python3 "$HELPERS/release_changelog.py" \
              --fragment "$fragment" --release-tag "$RELEASE_TAG" \
              --previous-tag "$PREVIOUS_TAG" --release-date "$release_date" \
              --github-repository "$GITHUB_REPOSITORY"
            rm "$fragment"
            python3 "$HELPERS/prepare_release.py" "$RELEASE_TAG"
            git add aiopnsense/const.py docs/source/changelog.md
            git diff --cached --check
            [[ "$(git diff --cached --name-only)" == $'aiopnsense/const.py\ndocs/source/changelog.md' ]]
            [[ "$(git status --porcelain --untracked-files=all)" == $'M  aiopnsense/const.py\nM  docs/source/changelog.md' ]]
            [[ "$(grep -Fc "## [$RELEASE_TAG](" docs/source/changelog.md)" == 1 ]]
            commit_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
            GIT_AUTHOR_NAME='github-actions[bot]'
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            GIT_AUTHOR_DATE="@$commit_epoch +0000"
            GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
            export GIT_AUTHOR_DATE GIT_COMMITTER_DATE
            git commit -m "Release $RELEASE_TAG"
            candidate_sha="$(git rev-parse HEAD)"
          fi
          handoff="$RUNNER_TEMP/release-candidate"
          mkdir -p "$handoff/dist"
          cp aiopnsense/const.py "$handoff/candidate-const.py"
          cp docs/source/changelog.md "$handoff/changelog.md"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$candidate_sha")"
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation --outdir "$handoff/dist"
          python3 "$HELPERS/release_handoff.py" canonicalize-sdist \
            --sdist "$handoff/dist/"*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          "$RUNNER_TEMP/release-tools/bin/twine" check "$handoff"/dist/*
          python3 "$HELPERS/release_handoff.py" create --handoff "$handoff" \
            --release-tag "$RELEASE_TAG" --release-id "$RELEASE_ID" --prerelease "$PRERELEASE" \
            --source-sha "$SOURCE_SHA" --candidate-sha "$candidate_sha" \
            --target-sha "$TARGET_SHA" --tag-oid "$TAG_OID"
      - name: Upload bounded candidate handoff
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/release-candidate/manifest.json
            ${{ runner.temp }}/release-candidate/candidate-const.py
            ${{ runner.temp }}/release-candidate/changelog.md
            ${{ runner.temp }}/release-candidate/dist/*.whl
            ${{ runner.temp }}/release-candidate/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      checks: read
      contents: write
      statuses: write
    outputs:
      prerelease: ${{ needs.candidate.outputs.prerelease }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot trusted helpers
        id: trusted
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" == "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" ]]
          helpers="$RUNNER_TEMP/trusted-release-helpers"
          mkdir -p "$helpers"
          cp .github/scripts/{prepare_release.py,release_version.py,release_handoff.py,verify_aiopnsense_distributions.py,verify_python_distributions.py,verify_release_checks.py,upload_release_asset.py} "$helpers/"
          echo "sha=$trusted_sha" >> "$GITHUB_OUTPUT"
          echo "helpers=$helpers" >> "$GITHUB_OUTPUT"
      - name: Download bounded candidate handoff
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - name: Independently prove refs and reconstruct candidate
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          HANDOFF: ${{ runner.temp }}/release-candidate
          HELPERS: ${{ steps.trusted.outputs.helpers }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" == "$DEFAULT_BRANCH" && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 "$HELPERS/prepare_release.py" --check-only --expected-prerelease "$PRERELEASE" "$RELEASE_TAG"
          git fetch --force --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          target_sha="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          [[ "$tag_sha" == "$EVENT_SHA" ]]
          source_sha="$EVENT_SHA"; candidate_sha="$EVENT_SHA"; resume=false
          python3 "$HELPERS/release_handoff.py" preflight \
            --handoff "$HANDOFF" --release-tag "$RELEASE_TAG"
          if [[ "$PRERELEASE" == true ]]; then
            git merge-base --is-ancestor "$EVENT_SHA" "$target_sha"
          elif [[ "$(git show -s --format=%s "$EVENT_SHA")" == "Release $RELEASE_TAG" ]]; then
            resume=true; source_sha="$(git rev-parse "$EVENT_SHA^")"
            [[ "$(git rev-list --parents -n 1 "$EVENT_SHA" | wc -w | tr -d ' ')" == 2 ]]
            [[ "$(git diff --name-only "$source_sha" "$EVENT_SHA")" == $'aiopnsense/const.py\ndocs/source/changelog.md' ]]
            git merge-base --is-ancestor "$EVENT_SHA" "$target_sha"
            expected_version="$RUNNER_TEMP/expected-version"
            git worktree add --detach "$expected_version" "$source_sha"
            python3 "$HELPERS/prepare_release.py" --repository "$expected_version" "$RELEASE_TAG"
            cmp --silent "$HANDOFF/candidate-const.py" "$expected_version/aiopnsense/const.py"
          else
            [[ "$target_sha" == "$EVENT_SHA" ]]
            reconstructed="$RUNNER_TEMP/reconstructed-candidate"
            git worktree add --detach "$reconstructed" "$source_sha"
            python3 "$HELPERS/prepare_release.py" --repository "$reconstructed" "$RELEASE_TAG"
            cmp --silent "$HANDOFF/candidate-const.py" "$reconstructed/aiopnsense/const.py"
            cp "$HANDOFF/candidate-const.py" "$reconstructed/aiopnsense/const.py"
            cp "$HANDOFF/changelog.md" "$reconstructed/docs/source/changelog.md"
            git -C "$reconstructed" add aiopnsense/const.py docs/source/changelog.md
            git -C "$reconstructed" diff --cached --check
            [[ "$(git -C "$reconstructed" diff --cached --name-only)" == $'aiopnsense/const.py\ndocs/source/changelog.md' ]]
            [[ "$(git -C "$reconstructed" status --porcelain --untracked-files=all)" == $'M  aiopnsense/const.py\nM  docs/source/changelog.md' ]]
            commit_epoch="$(git show -s --format=%ct "$source_sha")"
            GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_AUTHOR_DATE="@$commit_epoch +0000" GIT_COMMITTER_DATE="@$commit_epoch +0000" \
              git -C "$reconstructed" commit -m "Release $RELEASE_TAG"
            candidate_sha="$(git -C "$reconstructed" rev-parse HEAD)"
          fi
          source_root="$RUNNER_TEMP/reconstructed-source"
          if [[ "$PRERELEASE" == false && "$resume" == false ]]; then
            source_root="$RUNNER_TEMP/reconstructed-candidate"
          else
            git worktree add --detach "$source_root" "$candidate_sha"
          fi
          grep -Fx "VERSION = \"$RELEASE_TAG\"" "$source_root/aiopnsense/const.py" >/dev/null
          if [[ "$PRERELEASE" == false ]]; then
            [[ "$(grep -Fc "## [$RELEASE_TAG](" "$source_root/docs/source/changelog.md")" == 1 ]]
          fi
          python3 "$HELPERS/release_handoff.py" verify --handoff "$HANDOFF" \
            --release-tag "$RELEASE_TAG" --release-id "$RELEASE_ID" --prerelease "$PRERELEASE" \
            --source-sha "$source_sha" --candidate-sha "$candidate_sha" \
            --target-sha "$target_sha" --tag-oid "$tag_oid"
          cmp --silent "$HANDOFF/candidate-const.py" "$source_root/aiopnsense/const.py"
          cmp --silent "$HANDOFF/changelog.md" "$source_root/docs/source/changelog.md"
          python3 "$HELPERS/verify_aiopnsense_distributions.py" "$RELEASE_TAG" \
            --dist-dir "$HANDOFF/dist" --source-root "$source_root"
          {
            echo "candidate-sha=$candidate_sha"
            echo "target-sha=$target_sha"
            echo "tag-oid=$tag_oid"
            echo "resume=$resume"
          } >> "$GITHUB_OUTPUT"
      - name: Publish candidate to an isolated validation branch
        if: github.event.release.prerelease == false
        id: validation_ref
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          temp_ref="release-validation/${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format --branch "$temp_ref"
          gh auth setup-git --hostname github.com
          git push origin "$CANDIDATE_SHA:refs/heads/$temp_ref"
          echo "name=$temp_ref" >> "$GITHUB_OUTPUT"
      - name: Dispatch and verify immutable release gates
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HELPERS: ${{ steps.trusted.outputs.helpers }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          python3 "$HELPERS/verify_release_checks.py" --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$DEFAULT_BRANCH" --workflow-sha "$TRUSTED_SHA" --sha "$CANDIDATE_SHA" \
            --required-check 'pytest_check.yml::pytest check and post coverage' \
            --required-check 'docs.yml::build-docs' \
            --required-check 'uv-lock-check.yml::Validate uv lock consistency' \
            --required-check 'prek-autofix-review.yml::review'
      - name: Atomically advance target and guarded release tag
        if: github.event.release.prerelease == false && steps.release.outputs.resume != 'true'
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_TAG_OID: ${{ steps.release.outputs.tag-oid }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_SHA: ${{ steps.release.outputs.target-sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$ORIGINAL_TAG_OID" ]]
          [[ "$(git rev-parse "$CANDIDATE_SHA^")" == "$TARGET_SHA" ]]
          git tag -fa "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$CANDIDATE_SHA"
          gh auth setup-git --hostname github.com
          git push --atomic --force-with-lease="refs/heads/$DEFAULT_BRANCH:$TARGET_SHA" \
            --force-with-lease="refs/tags/$RELEASE_TAG:$ORIGINAL_TAG_OID" origin \
            "$CANDIDATE_SHA:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Verify final identity and upload release assets
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF: ${{ runner.temp }}/release-candidate
          HELPERS: ${{ steps.trusted.outputs.helpers }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          for asset in "$HANDOFF"/dist/*; do
            python3 "$HELPERS/upload_release_asset.py" --repository "$GITHUB_REPOSITORY" \
              --release-id "$RELEASE_ID" --expected-tag "$RELEASE_TAG" \
              --expected-prerelease "$PRERELEASE" --asset "$asset" \
              --asset-name "$(basename "$asset")" --content-type application/octet-stream
          done
      - name: Store verified distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: ${{ runner.temp }}/release-candidate/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Delete successful validation branch with its candidate lease
        if: ${{ success() && steps.validation_ref.outcome == 'success' }}
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate-sha }}
          GH_TOKEN: ${{ github.token }}
          TEMP_REF: ${{ steps.validation_ref.outputs.name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TEMP_REF:refs/remotes/origin/$TEMP_REF"
          [[ "$(git rev-parse "refs/remotes/origin/$TEMP_REF")" == "$CANDIDATE_SHA" ]]
          gh auth setup-git --hostname github.com
          git push --force-with-lease="refs/heads/$TEMP_REF:$CANDIDATE_SHA" origin --delete "$TEMP_REF"

  publish:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: ${{ needs.promote.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ needs.promote.outputs.prerelease == 'true' && 'https://test.pypi.org/project/aiopnsense/' || 'https://pypi.org/project/aiopnsense/' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish prerelease to TestPyPI
        if: needs.promote.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish stable release to PyPI
        if: needs.promote.outputs.prerelease != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
